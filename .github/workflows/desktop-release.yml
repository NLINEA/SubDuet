name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip 'setuptools>=83'
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/check_docs.py
      - run: python scripts/check_secrets.py --history
      - run: ruff check .
      - run: mypy src/paircue src/subduet
      - run: pytest --cov=paircue --cov=subduet --cov-report=term-missing --cov-fail-under=60
      - run: python scripts/check_runtime_licenses.py
      - run: pip-audit

  build:
    needs: verify
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            label: macOS arm64
            artifact: subduet-macos-arm64
            archive: SubDuet-macOS-arm64.zip
          - runner: macos-15-intel
            label: macOS Intel
            artifact: subduet-macos-x64
            archive: SubDuet-macOS-x64.zip
          - runner: windows-latest
            label: Windows x64
            artifact: subduet-windows-x64
            archive: SubDuet-windows-x64.zip
          - runner: ubuntu-latest
            label: Linux x64
            artifact: subduet-linux-x64
            archive: SubDuet-linux-x64.tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip 'setuptools>=83'
      - run: python -m pip install '.[release]'
      - name: Build and smoke-test the packaged desktop app
        run: python scripts/build_desktop.py
      - name: Confirm packaged files contain no private data
        run: python scripts/check_secrets.py --path release/stage
      - name: Archive macOS build
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent release/stage/SubDuet-* "release/${{ matrix.archive }}"
      - name: Archive Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path release/stage/SubDuet-* -DestinationPath "release/${{ matrix.archive }}"
      - name: Archive Linux build
        if: runner.os == 'Linux'
        run: tar -C release/stage -czf "${{ github.workspace }}/release/${{ matrix.archive }}" SubDuet-linux-x64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.archive }}
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release
          merge-multiple: true
      - name: Verify all four release archives are present
        run: |
          test -s release/SubDuet-macOS-arm64.zip
          test -s release/SubDuet-macOS-x64.zip
          test -s release/SubDuet-windows-x64.zip
          test -s release/SubDuet-linux-x64.tar.gz
          test "$(find release -maxdepth 1 -type f -name 'SubDuet-*' | wc -l)" -eq 4
      - name: Create SHA-256 checksums
        working-directory: release
        run: sha256sum SubDuet-* > SHA256SUMS.txt
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --verify-tag --generate-notes --prerelease
          gh release upload "$RELEASE_TAG" release/* --clobber
