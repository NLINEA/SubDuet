name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip 'setuptools>=83'
      - run: python -m pip install -e '.[dev]'
      - name: Install media tools for synthetic multi-track regression
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python scripts/check_docs.py
      - run: python scripts/check_secrets.py --history
      - run: ruff check .
      - run: mypy src/paircue src/subduet
      - run: pytest --cov=paircue --cov=subduet --cov-report=term-missing --cov-fail-under=60
      - run: pip-audit

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build --tag subduet:test .

  runtime-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip 'setuptools>=83'
      - run: python -m pip install packaging .
      - run: python scripts/check_runtime_licenses.py --sbom subduet-sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: subduet-runtime-sbom
          path: subduet-sbom.cdx.json

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - run: python scripts/check_dco.py "$BASE_REF" HEAD
        env:
          BASE_REF: origin/${{ github.base_ref }}
