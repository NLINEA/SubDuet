[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "subduet"
version = "0.1.0b15"
description = "Cross-platform aligned bilingual subtitles for language learning"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Zackary" }]
keywords = [
  "plex",
  "jellyfin",
  "emby",
  "subtitles",
  "bilingual",
  "language-learning",
  "translation",
  "nas",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
]

dependencies = [
  "charset-normalizer>=3.4,<4",
  "fastapi>=0.128,<1",
  "httpx>=0.28,<1",
  "numpy>=2.0,<2.5",
  "opencc-python-reimplemented>=0.1.7,<1",
  "pydantic-settings>=2.12,<3",
  "python-multipart>=0.0.20,<1",
  "srt>=3.5.3,<4",
  "uvicorn>=0.35,<1",
]

[project.urls]
Homepage = "https://github.com/NLINEA/SubDuet"
Repository = "https://github.com/NLINEA/SubDuet"
Issues = "https://github.com/NLINEA/SubDuet/issues"
Documentation = "https://github.com/NLINEA/SubDuet/tree/main/docs"
Discussions = "https://github.com/NLINEA/SubDuet/discussions"
Releases = "https://github.com/NLINEA/SubDuet/releases"
Changelog = "https://github.com/NLINEA/SubDuet/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "mypy>=1.17,<3",
  "packaging>=24,<27",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]
release = [
  "pyinstaller>=6.21,<7",
]

[project.scripts]
subduet = "paircue.cli:main"
paircue = "paircue.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/paircue", "src/subduet"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"src/paircue/downloads_api.py" = ["E501"]
"tests/*" = ["S104", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["paircue", "subduet"]

[[tool.mypy.overrides]]
module = ["opencc", "srt"]
ignore_missing_imports = true
