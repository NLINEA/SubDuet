# Keep the Compose project and volume names to reuse existing private state on upgrade.
name: paircue

services:
  core:
    build: .
    image: subduet:0.1.0b15
    restart: unless-stopped
    env_file: paircue.env
    user: "${PUID:-10001}:${PGID:-10001}"
    ports:
      - "127.0.0.1:${PAIRCUE_PORT:-9292}:9292"
    volumes:
      - "${MEDIA_PATH:?Set MEDIA_PATH}:/media:rw"
      - paircue-state:/state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9292/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  downloads:
    profiles: ["downloads"]
    build: .
    image: subduet:0.1.0b15
    command: ["subduet", "downloads"]
    restart: unless-stopped
    env_file: downloads.env
    user: "${PUID:-10001}:${PGID:-10001}"
    ports:
      - "127.0.0.1:${DOWNLOADS_PORT:-9293}:9293"
    volumes:
      - "${TORRENT_WATCH_PATH:?Set TORRENT_WATCH_PATH}:/torrents:rw"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  paircue-state:
